# Detect suspicious patterns and flag PRs

name: Slop Detect

on:
  pull_request_target:
      types: [opened, reopened]
permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  backport:
    name: PR analysis
    runs-on: ubuntu-latest
    steps:
      - uses: peakoss/anti-slop@57858eead489d08b255fab2af45a506c2ca6eab2 # v0.3.0
        with:
          max-failures: 4
          blocked-terms: |
            Generated with [Claude Code]
            claude.ai/code
            claude.com/claude-code
            Co-Authored-By: Claude
            🤖
          blocked-source-branches: |
            claude/*
          failure-add-pr-labels: warn-slop
          close-pr: true
          failure-pr-message: |
            Automation thinks this PR was made largely with AI, if you think this is an error comment on this PR and someone from the team will review.
            Repeated drive-by slop will get you banned.
