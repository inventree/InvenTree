# Detect suspicious patterns and flag PRs

name: Slop Detect

on:
  # pull_request_target:
  #   types: [opened, reopened]
  pull_request:
    branches: [master]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  backport:
    name: PR analysis
    runs-on: ubuntu-latest
    steps:
      - uses: peakoss/anti-slop@57858eead489d08b255fab2af45a506c2ca6eab2 # v0.3.0
        with:
          max-failures: 4
          blocked-terms: |
            Generated with [Claude Code]
            claude.ai/code
            claude.com/claude-code
            Co-Authored-By: Claude
            🤖
          blocked-source-branches: |
            claude/*
          failure-add-pr-labels: warn-slop
          close-pr: true
          failure-pr-message: |
            Automation thinks this PR was made largely with AI, if you think this is an error comment on this PR and someone from the team will review.
            Repeated drive-by slop will get you banned.

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Jondolf/ai-commit-check@7069d4254c6310cdb0395a6ab0ca1f29af897f83 # v1.0.1
        id: ai-check
        with:
          fail-on-detection: false
      - uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Found $COUNT AI commit(s); review your commits and ensure you follow the contribution guidelines.'
            })
          COUNT: ${{ steps.ai-check.outputs.count }}
      - name: AI commit warning
        if: steps.ai-check.outputs.ai-commits-found == 'true'
        run: |
          echo "::warning::Found $COUNT AI commit(s); review your commits and ensure you follow the contribution guidelines."
          exit 1
        env:
          COUNT: ${{ steps.ai-check.outputs.count }}
