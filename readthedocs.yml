version: 2

mkdocs:
  configuration: docs/mkdocs.yml

python:
  install:
    - requirements: docs/requirements.txt
    - requirements: src/backend/requirements.txt

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.12"
  jobs:
    post_install:
      - pip install -U invoke
      - echo "Generating API schema file"
      - invoke build-docs
    post_build:
      - echo "Checking built documentation"
      - python docs/ci/check_api_schema.py
      - python docs/ci/check_mkdocstrings.py
      - python docs/ci/check_images.py
      - python docs/ci/check_settings.py
      - python docs/ci/check_config.py
      - python docs/ci/check_data_tables.py
      - python docs/ci/check_invoke_commands.py
      - python docs/ci/check_included_files.py
      - python docs/ci/check_rendering.py
